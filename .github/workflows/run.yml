name: auto-affiliate

on:
  schedule:
    # 毎時37分（GitHubの定期実行は遅延・欠落があるため回数を多めに。投稿は7〜23時・60分間隔・1日上限で制御）
    - cron: '37 * * * *'
  workflow_dispatch: {}
  # コードや設定を更新したら即反映（ボットの心拍コミットは対象外）
  push:
    branches: [main]
    paths: ['src/**', 'config/**', '.github/workflows/**']

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: auto-affiliate
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 状態（DB・ログ）は公開リポジトリに置かず Actions キャッシュで引き継ぐ
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: state-${{ github.run_id }}
          restore-keys: state-
      - name: Pipeline
        env:
          DRY_RUN: ${{ vars.DRY_RUN || '1' }}
          LIVE_FROM: ${{ vars.LIVE_FROM }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          RAKUTEN_ALLOWED_SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          BSKY_HANDLE: ${{ vars.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          YAHOO_APP_ID: ${{ secrets.YAHOO_APP_ID }}
          YAHOO_VC_AFFILIATE_ID: ${{ secrets.YAHOO_VC_AFFILIATE_ID }}
          PINTEREST_ACCESS_TOKEN: ${{ secrets.PINTEREST_ACCESS_TOKEN }}
          PINTEREST_REFRESH_TOKEN: ${{ secrets.PINTEREST_REFRESH_TOKEN }}
          PINTEREST_APP_ID: ${{ secrets.PINTEREST_APP_ID }}
          PINTEREST_APP_SECRET: ${{ secrets.PINTEREST_APP_SECRET }}
          PINTEREST_BOARD_ID: ${{ vars.PINTEREST_BOARD_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          SITE_TITLE: 楽天 値下がり・新着速報
          MAX_POSTS_PER_DAY: ${{ vars.MAX_POSTS_PER_DAY || '6' }}
          MIN_AFFILIATE_RATE: ${{ vars.MIN_AFFILIATE_RATE || '2' }}  # 売れ筋（多くは2〜3%）も対象に。並びは想定報酬額順
        run: mkdir -p data && node --no-warnings src/run.js | tee -a data/run.log
      - name: Trim log
        if: always()
        run: tail -n 3000 data/run.log > data/run.tmp && mv data/run.tmp data/run.log || true
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: state-${{ github.run_id }}
      # 公開リポジトリは60日更新がないと定期実行が止まるため、最終実行時刻だけをコミット
      - name: Heartbeat
        run: |
          date -u +%F > last-run.txt  # 日付だけ記録＝コミットは1日1回
          git config user.name "auto-affiliate-bot"
          git config user.email "auto-affiliate-bot@users.noreply.github.com"
          git add last-run.txt STOP 2>/dev/null || git add last-run.txt
          git commit -m "heartbeat" && git push || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
