name: auto-affiliate

on:
  schedule:
    # 日本時間 8:10 / 12:10 / 18:10 / 21:10（GitHubはUTC指定）
    - cron: '10 23,3,9,12 * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: auto-affiliate
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # 状態（DB・ログ）は公開リポジトリに置かず Actions キャッシュで引き継ぐ
      - uses: actions/cache/restore@v4
        with:
          path: data
          key: state-${{ github.run_id }}
          restore-keys: state-
      - name: Pipeline
        env:
          DRY_RUN: ${{ vars.DRY_RUN || '1' }}
          RAKUTEN_APP_ID: ${{ secrets.RAKUTEN_APP_ID }}
          RAKUTEN_ACCESS_KEY: ${{ secrets.RAKUTEN_ACCESS_KEY }}
          RAKUTEN_AFFILIATE_ID: ${{ secrets.RAKUTEN_AFFILIATE_ID }}
          RAKUTEN_ALLOWED_SITE: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          THREADS_USER_ID: ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          BSKY_HANDLE: ${{ vars.BSKY_HANDLE }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          MAX_POSTS_PER_DAY: ${{ vars.MAX_POSTS_PER_DAY || '6' }}
        run: mkdir -p data && node --no-warnings src/run.js | tee -a data/run.log
      - name: Trim log
        if: always()
        run: tail -n 3000 data/run.log > data/run.tmp && mv data/run.tmp data/run.log || true
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: state-${{ github.run_id }}
      # 公開リポジトリは60日更新がないと定期実行が止まるため、最終実行時刻だけをコミット
      - name: Heartbeat
        run: |
          date -u +%FT%TZ > last-run.txt
          git config user.name "auto-affiliate-bot"
          git config user.email "auto-affiliate-bot@users.noreply.github.com"
          git add last-run.txt STOP 2>/dev/null || git add last-run.txt
          git commit -m "heartbeat" && git push || true
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
